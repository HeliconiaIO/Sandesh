<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandesh</title>
    <meta name="description" content="Local mail infrastructure for developers." />
    <!--
      Set the theme before first paint. Without this the dark default flashes
      white for a light-theme user on every load.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sandesh.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          /* Private mode denies storage; the dark default already applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
