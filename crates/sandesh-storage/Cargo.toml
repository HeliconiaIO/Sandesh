[package]
name = "sandesh-storage"
description = "SQLite implementation of the sandesh-core storage ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sandesh-core = { path = "../sandesh-core" }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The webhook payload is rendered at enqueue time, inside the delivery
# transaction (ADR-086), so the JSON body is built here rather than in the
# worker -- a message deleted before the worker runs must not silently change
# what the notification says.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
