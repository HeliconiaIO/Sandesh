[package]
name = "sandesh-proto"
description = "Shared transport and session scaffolding for Sandesh's line protocols."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sandesh-core = { path = "../sandesh-core" }
async-trait = { workspace = true }
argon2 = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` gives the paused clock the transcript-flush tests use: a
# real 500ms interval would make them slow and timing-dependent.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "test-util"] }

[lints]
workspace = true
