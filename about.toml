# cargo-about: the third-party licence texts shipped with every release.
#
# `deny.toml` decides which licences are allowed into the tree; this file only
# collects their texts so a binary carries the attribution its dependencies
# require. Keep `accepted` in step with `[licenses] allow` in `deny.toml` —
# `scripts/third_party_notices.py` reads that list for the npm side too.

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "OpenSSL",
]

targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Development dependencies never reach a shipped artifact, so they owe it no
# notice.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# `ring`'s licence file is a bespoke combination that no SPDX scanner reads;
# cargo-about ships a known-good clarification for it.
workarounds = ["ring"]
