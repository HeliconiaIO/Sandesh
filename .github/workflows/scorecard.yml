# OpenSSF Scorecard: an outside check of the project's supply-chain practices
# (branch protection, pinned actions, signed releases, ...). Results appear in
# the Security tab and on the README badge.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
