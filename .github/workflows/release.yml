# Sandesh release.
#
# Pushing a `vX.Y.Z` tag publishes a GitHub Release: binaries for every target,
# `.deb` and `.rpm`, a multi-arch container image on GHCR, SBOMs, SHA256SUMS,
# build-provenance attestations, and release notes taken from CHANGELOG.md.
# The procedure around it is RELEASING.md.
#
# The build steps mirror the `release` and `package` jobs in ci.yml, which
# smoke-test the same scripts on every push to main; this workflow only adds
# what a publication needs on top of them.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag, version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # A tag that disagrees with Cargo.toml would publish archives named for one
      # version under a release titled for another; a missing changelog section
      # would publish a release with no notes. Both stop the release here.
      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(awk '/^\[workspace.package\]/{w=1} w && /^version/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"; exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section"; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  notices:
    name: Third-party notices
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-cyclonedx
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - run: python3 scripts/third_party_notices.py

      # SBOMs for both dependency trees the binary embeds.
      - name: SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          # One file per workspace package; the root `sandesh` package is the
          # shipped binary, and its SBOM covers everything it links.
          cargo cyclonedx --format json --all-features
          cp sandesh.cdx.json sbom/sandesh-rust.cdx.json
          (cd web && npm sbom --omit dev --sbom-format cyclonedx) > sbom/sandesh-web.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: |
            THIRD_PARTY_LICENSES.txt
            sbom/

  binaries:
    name: Binary (${{ matrix.target }})
    needs: notices
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: notices
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        if: runner.os != 'Linux'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI
        if: runner.os != 'Linux'
        working-directory: web
        run: npm ci && npm run build
      - uses: docker/setup-buildx-action@v3
        if: runner.os == 'Linux'
      - run: python3 scripts/release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  packages:
    name: Linux packages
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The packages are built from the released archive, not a second build,
      # so the binary inside a .deb is the one in the tarball.
      - uses: actions/download-artifact@v7
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist/
      - uses: docker/setup-buildx-action@v3
      - run: python3 scripts/package_deb.py --arch amd64
      - run: python3 scripts/deb_smoke.py
      - run: python3 scripts/package_rpm.py --arch x86_64
      - run: python3 scripts/rpm_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.sha256

  image:
    name: Container image
    needs: [verify, notices]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: notices
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/heliconiaio/sandesh
          # `latest` only for a final release, never for an -rc.
          flavor: latest=${{ needs.verify.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-amd64
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/heliconiaio/sandesh
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish GitHub Release
    needs: [verify, binaries, packages, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Named, not "everything": build-push-action uploads a `.dockerbuild`
      # record to the run that download-artifact cannot extract.
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: artifacts/
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: notices
          path: artifacts/notices/

      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.cdx.json' -o -name 'THIRD_PARTY_LICENSES.txt' \) \
            -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS

      - id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'release/*'

      # The attestation above lives in GitHub's attestation store, which
      # `gh attestation verify` reads but nothing outside GitHub can see. The
      # same signed bundle is attached to the release so verifiers (and the
      # OpenSSF Scorecard Signed-Releases check) find it with the assets. Added
      # after the checksums on purpose: it describes those files, it is not one.
      - name: Attach provenance
        run: cp "${{ steps.attest.outputs.bundle-path }}" "release/sandesh-${{ needs.verify.outputs.version }}.intoto.jsonl"

      # The notes are the CHANGELOG section for this version, verbatim: one
      # place to write them, reviewed in the release pull request.
      - name: Release notes
        run: |
          set -euo pipefail
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            /^\[[^]]+\]: / {next}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ### Install

          - **Container:** \`docker run -d -p 1025:1025 -p 1080:1080 -p 1143:1143 -p 1110:1110 -v sandesh-data:/data ghcr.io/heliconiaio/sandesh:$v\`
          - **Binaries and packages:** below. Verify with \`sha256sum -c SHA256SUMS --ignore-missing\`
            and \`gh attestation verify <file> -R ${{ github.repository }}\`.
          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          [ "${{ needs.verify.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Sandesh ${{ needs.verify.outputs.version }}" \
            --notes-file notes.md --generate-notes --verify-tag "${flags[@]}"
