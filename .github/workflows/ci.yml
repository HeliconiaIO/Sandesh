# Sandesh CI.
#
# The Rust gates from earlier phases are preserved exactly; Phase 4 adds the
# contract and frontend gates. The job that matters most is `contract`: it is
# what makes it impossible to change the backend's public shape and leave the
# generated TypeScript stale (§36, ADR-028).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Fuzzing runs on a schedule rather than per-PR: it is time-boxed rather than
  # pass/fail on a fixed input, so gating a pull request on it would make merge
  # time depend on how long the fuzzer felt like looking (TESTING_STRATEGY §9).
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege: every job reads the repository and nothing else. A job that
# needs more asks for it by name.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failed build should not be a slow build.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `sandesh-desktop` is a workspace member, so `--workspace` builds Tauri,
      # which links GTK and WebKit. The runner image ships neither; without them
      # `glib-sys`'s build script fails before anything else compiles.
      - name: Install desktop system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The fuzz crate is outside the workspace (see its manifest), so the line
      # above does not reach it. Its checks run on stable and replay the whole
      # `testdata/` corpus plus any committed crash reproducer, which is what
      # keeps the fuzz assertions from rotting between nightly runs.
      - name: Fuzz checks (stable replay)
        run: cargo test --manifest-path fuzz/Cargo.toml --lib --tests

      # TESTING_STRATEGY.md §"Gates" has required >=85% on `sandesh-core` and
      # the protocol crates since Phase 0, but nothing measured it until
      # Phase 7's Definition-of-Done check. It was not decorative: the first
      # measurement put `sandesh-pop3` at 84.15%, with SASL failure paths
      # untested. Enforced here so the floor cannot drift again unnoticed.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The ordinary `cargo test` above has already built and cached the
      # uninstrumented artifacts. Coverage rebuilds the whole workspace with
      # `-C instrument-coverage` into a *separate* target directory, and those
      # artifacts are large: measured locally, one instrumented integration
      # binary is ~250MB with full debug info and the workspace links 53 of
      # them. A hosted runner has ~14GB of free disk, so the first attempt at
      # this step died with `ld terminated with signal 7 [Bus error]` — the
      # linker being starved, not a compile error and not a coverage failure.
      #
      # Reclaiming the runner's preinstalled toolchains buys back ~25GB.
      - name: Free disk space for the instrumented build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Coverage floor (core and protocol crates)
        env:
          # Coverage needs line mappings, not full DWARF. Measured: this takes
          # one instrumented test binary from 248MB to 85MB, a 66% cut, which
          # is what keeps the link inside the runner's memory.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          # One codegen unit per crate rather than sixteen: fewer, smaller
          # object files for the linker to hold at once.
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
        # `pipefail` because `cargo ... | tee` otherwise reports the exit code
        # of `tee`: a coverage run that failed outright would hand the gate an
        # empty file rather than failing the step. (The gate rejects an empty
        # report too, but the honest error belongs at the step that broke.)
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --summary-only | tee coverage-summary.txt
          python3 scripts/coverage_gate.py < coverage-summary.txt

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # Regenerates the OpenAPI document and the TypeScript from the Rust API
      # and fails if either differs from what is committed. A developer who
      # changes a DTO and does not regenerate is stopped here rather than
      # shipping a frontend typed against an API that no longer exists.
      - name: Verify the generated contract is current
        run: cargo xtask generate-api --check

      # Belt and braces: `--check` restores what it wrote, so the tree must be
      # clean afterwards. A diff here means generation is not deterministic.
      - name: Verify no generated file drifted
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files differ after the drift check."
            git diff --stat
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # The UI must be built before the binary, because it is embedded at
      # compile time.
      - name: Build the UI
        working-directory: web
        run: npm run build

      - name: Build Sandesh
        run: cargo build --release

      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        working-directory: web
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `cargo-deny` reads `Cargo.lock` and the manifests; it does not build the
      # workspace, so this job needs no Rust cache and finishes in seconds.
      - uses: dtolnay/rust-toolchain@stable

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # All four checks from `deny.toml`: advisories (RustSec), licences
          # (the allowlist of DEPENDENCIES §8), bans (the rejected dependencies
          # of §7) and sources (crates.io only).
          command: check
          # The advisory database moves independently of this repository, so a
          # pull request can start failing on an advisory published after it was
          # opened. That is the intended behaviour — see the `schedule` trigger
          # above, which is what catches one published after a merge.
          arguments: --all-features

      # The fuzz crate is outside the workspace (see `exclude` in Cargo.toml),
      # so it has its own lockfile that the step above never reads. Nothing
      # else refreshes it, and it fell behind on tokio and rustls advisories
      # the workspace lockfile had already fixed. Advisories only: it ships
      # nothing, so licences and bans do not apply.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories

  npm-audit:
    name: npm advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # `--omit=dev` is the gate, and the distinction is the whole point: only
      # `dependencies` reach the browser bundle that ships inside the binary. A
      # vulnerability in vitest or the OpenAPI generator is worth fixing but is
      # not a vulnerability in Sandesh, and failing the build on one would train
      # everyone to ignore this job.
      - name: Shipped dependencies
        run: npm audit --omit=dev --audit-level=low

      # Development tooling is reported without failing a pull request, so a
      # real finding is visible in the log rather than invisible until someone
      # runs it locally. The nightly run does fail on it: with no update bot,
      # that is what stops dev dependencies going quietly stale.
      - name: Development dependencies (fails nightly only)
        env:
          EVENT: ${{ github.event_name }}
        run: npm audit --audit-level=moderate || [ "$EVENT" != schedule ]

      # The npm counterpart of cargo-deny's licence check: every package that
      # reaches the shipped bundle must carry a licence from deny.toml's list.
      - name: Shipped dependency licences
        working-directory: .
        run: python3 scripts/third_party_notices.py --check

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Every commit in the pull request must carry a Signed-off-by line
      # (CONTRIBUTING.md). Checked here rather than by an app so the rule lives
      # in the repository with everything else CI enforces.
      - name: Check Signed-off-by
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  docker:
    name: Docker image (${{ matrix.platform }})
    # Each architecture on its own native runner. arm64 used to build under
    # QEMU on an x86_64 runner, which took over half an hour; GitHub's arm64
    # runners are free for public repositories and build it in minutes.
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture's failure must not hide the other's: arm64 breaking is
      # exactly the case this matrix exists to catch, and it is the one most
      # likely to break alone.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Built and *run*, not merely built. A Dockerfile that compiles proves the
      # image exists; only starting it proves the static binary links correctly
      # on `scratch`, that the embedded UI survived the multi-stage copy, and
      # that every listener comes up — none of which has another test
      # (ROADMAP Phase 10).
      #
      # Each architecture is loaded and smoke-tested separately rather than as
      # one manifest list: `docker buildx --load` cannot load a multi-platform
      # image into the daemon, and a manifest that was only ever pushed would
      # mean asserting the index rather than the images inside it.
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: sandesh:ci-${{ matrix.arch }}
          # Keyed by architecture: one shared key would have each build evicting
          # the other's layers on every run.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Smoke test ${{ matrix.platform }}
        run: python3 scripts/docker_smoke.py sandesh:ci-${{ matrix.arch }} ${{ matrix.platform }}

  release:
    name: Release binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target's failure must not hide the others': a release is only as
      # good as its worst platform, and cancelling the matrix would report one
      # broken target as though the rest were unknown.
      fail-fast: false
      matrix:
        include:
          # Built through the Dockerfile's own build stage, so the released
          # binary and the smoke-tested image are the same bytes (ADR-096).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            smoke: true
          # Built and smoke-tested on a native arm64 runner. Under QEMU on
          # x86_64 it took over half an hour and could not be executed at all.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            smoke: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            smoke: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            smoke: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            smoke: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Only the natively-built targets need Node here; the Linux targets get
      # their frontend from the Dockerfile's `web` stage.
      - uses: actions/setup-node@v7
        if: runner.os != 'Linux'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `rust-embed` compiles `web/dist` into the binary, so the UI must exist
      # before cargo runs — the same ordering the Dockerfile enforces by stage
      # order, and the reason `release.py` refuses to build without it.
      - name: Build the UI
        if: runner.os != 'Linux'
        working-directory: web
        run: npm ci && npm run build

      - uses: docker/setup-buildx-action@v3
        if: runner.os == 'Linux'

      - name: Build the release artifact
        run: python3 scripts/release.py --target ${{ matrix.target }}

      # The acceptance criterion is "builds in CI *and runs a smoke test*".
      # Running it on the host — outside any container — is what proves the
      # musl binary is genuinely static, which `docker_smoke.py` cannot show.
      - name: Smoke test the artifact
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          archive=$(ls dist/sandesh-*-${{ matrix.target }}.* | grep -v '\.sha256$')
          python3 scripts/binary_smoke.py "$archive"

      - uses: actions/upload-artifact@v7
        with:
          name: sandesh-${{ matrix.target }}
          path: dist/
          retention-days: 14

  package:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Builds the release archive first if it is not present, so this job is
      # self-contained rather than depending on `release` having uploaded one.
      - name: Build the package
        run: python3 scripts/package_deb.py --arch amd64

      # Installed in a real Debian container and run, not merely inspected.
      # `dpkg-deb --info` shows what a package claims; only `apt install` shows
      # whether the maintainer scripts work — which is how the first version's
      # `adduser: not found` was caught (ADR-097).
      - name: Smoke test the package
        run: python3 scripts/deb_smoke.py

      - uses: actions/upload-artifact@v7
        with:
          name: sandesh-deb-amd64
          path: dist/*.deb
          retention-days: 14

      # rpmbuild runs inside a Fedora container, so this needs no host tooling
      # beyond Docker (ADR-098).
      - name: Build the RPM
        run: python3 scripts/package_rpm.py --arch x86_64

      - name: Smoke test the RPM
        run: python3 scripts/rpm_smoke.py

      - uses: actions/upload-artifact@v7
        with:
          name: sandesh-rpm-x86_64
          path: dist/*.rpm
          retention-days: 14

  fuzz:
    name: Fuzz
    # Nightly only, or on demand. A pull request gets the stable replay in the
    # `rust` job instead, which is deterministic and fast.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # One target's crash must not cancel the others: each is an independent
      # finding, and the whole point of a nightly run is to collect all of them.
      fail-fast: false
      matrix:
        target:
          - mime_parser
          - smtp_command
          - imap_command
          - pop3_command
          - search_query
          - link_extract
    steps:
      - uses: actions/checkout@v7

      # libFuzzer needs nightly: `-Z sanitizer=address` is unstable.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Carry the corpus between runs so coverage accumulates instead of
      # restarting from the seeds every night.
      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # Seed the MIME target from the real corpus on a cold cache.
      - name: Seed the MIME corpus
        if: matrix.target == 'mime_parser'
        run: |
          mkdir -p fuzz/corpus/mime_parser
          find testdata -name '*.eml' -exec sh -c \
            'cp "$1" "fuzz/corpus/mime_parser/$(echo "$1" | tr / _)"' _ {} \;

      - name: Fuzz
        # `+nightly` overrides rust-toolchain.toml: cargo-fuzz needs nightly's
        # sanitizer flags, and the pinned stable would reject them.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600 -max_len=65536

      # A crash reproducer is the valuable output of a failed run: upload it so
      # it can be committed to `fuzz/artifacts/<target>/`, where the stable
      # replay picks it up on every subsequent commit.
      - name: Upload any crash reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
