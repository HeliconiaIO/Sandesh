name: Feature request
description: Suggest something Sandesh should do.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to test or debug, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you have in mind. Alternatives you considered are welcome too.
    validations:
      required: true
